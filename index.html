<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monster Hunter Wilds: Diagnostic Manual</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/themetoggle-and-searchbar.js"></script>
    <script src="/js/sidebar.js" defer></script>
    <script src="/js/topbar.js" defer></script>
  </head>
  <body>
    <nav class="topbar">
      <button type="button" id="themeToggle">☾</button>
    </nav>
    <div class="layout">
      <nav class="sidebar">
        <input
          type="text"
          id="searchBar"
          placeholder="Search errors..."
          oninput="filterErrors()"
        />
        <h2>List of Errors</h2>
        <ul id="errorList"></ul>
      </nav>
      <div class="main">
        <header>
          <h1>Monster Hunter Wilds: Diagnostic Manual</h1>
          <p>
            A community-driven diagnostic manual for recurring errors in Monster
            Hunter Wilds. Navigate the sidebar to find errors and solutions.
          </p>
        </header>
      </div>
    </div>
  </body>
</html>
